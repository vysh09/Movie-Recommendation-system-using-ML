<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Recommendation</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #423939;
      color: #fff;
    }
    header {
      padding: 1rem 2rem;
      background-color: #000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      color: red;
      font-size: 1.8rem;
    }
    .controls {
      display: flex;
      gap: 1rem;
    }
    input, select, button {
      padding: 0.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
    }
    button {
      background-color: red;
      color: white;
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1rem;
      padding: 2rem;
    }
    .movie-card {
      background-color: #222;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      transition: transform 0.2s;
    }
    .movie-card:hover {
      transform: scale(1.05);
    }
    .movie-card img {
      width: 100%;
      height: auto;
    }
    .movie-info {
      padding: 0.5rem;
    }
    .movie-title {
      font-size: 1rem;
      font-weight: bold;
      margin: 0.5rem 0;
    }
    .movie-meta {
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <header>
    <h1>Movie Recommender</h1>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search by title or genre...">
      <select id="genreSelect">
        <option value="">Select Genre</option>
        <option>Action</option>
        <option>Romance</option>
        <option>Comedy</option>
        <option>Drama</option>
        <option>Horror</option>
        <option>Sci-Fi</option>
        <option>Thriller</option>
      </select>
      <button onclick="searchMovies()">Search</button>
      <button onclick="recommendByGenre()">Genre</button>
      <button onclick="recommendSimilar()">KNN</button>
    </div>
  </header>

  <main class="grid" id="results"></main>

  <script>
    const resultsDiv = document.getElementById("results");

    function renderMovies(movies) {
      resultsDiv.innerHTML = movies.map(movie => `
        <div class="movie-card">
          <img src="${movie.poster}" alt="${movie.title}" onerror="this.src='https://via.placeholder.com/150x220?text=No+Image'">
          <div class="movie-info">
            <div class="movie-title">${movie.title}</div>
            <div class="movie-meta">${movie.genre} | ⭐ ${movie.rating}</div>
          </div>
        </div>
      `).join("");
    }

    async function searchMovies() {
      const query = document.getElementById("searchInput").value;
      const res = await fetch("http://127.0.0.1:5000/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query })
      });
      const data = await res.json();
      renderMovies(data.results || []);
    }

    async function recommendByGenre() {
      const genre = document.getElementById("genreSelect").value;
      const res = await fetch("http://127.0.0.1:5000/recommend", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ genre })
      });
      const data = await res.json();
      renderMovies(data.recommendations || []);
    }

    async function recommendSimilar() {
      const title = document.getElementById("searchInput").value;
      const res = await fetch("http://127.0.0.1:5000/knn", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title })
      });
      const data = await res.json();
      renderMovies(data.recommendations || []);
    }
  </script>
</body>
</html>
